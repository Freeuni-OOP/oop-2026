# --- Server ---------------------------------------
server.port=8084

# --- MySQL Database (Docker) ---------------------------------------
# Start the DB first:  docker compose up -d
# Matches credentials in docker-compose.yaml
spring.datasource.url=jdbc:mysql://localhost:3307/book_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=rootuser
spring.datasource.password=rootpass

# --- JPA / Hibernate ---------------------------------------
# update  = alter existing tables (keeps data between restarts)
# create  = drop + recreate on every start (use for demo resets)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
