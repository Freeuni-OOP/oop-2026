<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | Student Manager'">Student Manager</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,.08); border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; }
        .table thead th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; border-bottom: 2px solid #dee2e6; }
        .badge-major { font-size: .75rem; padding: .35em .65em; border-radius: 20px; }
        .btn-action { padding: .25rem .6rem; font-size: .8rem; }
        .stat-card { border-radius: 12px; color: #fff; padding: 1.25rem 1.5rem; }
    </style>
</head>
<body>

<!-- ── Navbar ── -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/ui/students}">
            <i class="bi bi-mortarboard-fill me-2"></i>Student Manager
        </a>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/ui/students}" class="text-white text-decoration-none">
                <i class="bi bi-people-fill me-1"></i>Students
            </a>
            <!-- Show login/logout depending on auth state -->
            <span sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span class="badge bg-light text-primary">
                    <i class="bi bi-person-check me-1"></i>
                    <span sec:authentication="name">User</span>
                </span>
                <form th:action="@{/ui/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </span>
            <span sec:authorize="!isAuthenticated()">
                <a th:href="@{/ui/login}" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </a>
            </span>
        </div>
    </div>
</nav>

</body>
</html>
