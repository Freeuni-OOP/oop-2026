# ?? Server ?????????????????????????????????????????????????????????????????????
server.port=8082

# ?? MySQL (Docker) ?????????????????????????????????????????????????????????????
# Start with: docker compose up -d   (see docker-compose.yml in this folder)
spring.datasource.url=jdbc:mysql://localhost:3308/lecture26db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=lecture26user
spring.datasource.password=lecture26pass

# ?? JPA / Hibernate ????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ?? Security ???????????????????????????????????????????????????????????????????
# Set via env vars in production:  $env:ADMIN_USERNAME="..."; $env:ADMIN_PASSWORD="..."
app.security.admin-username=${ADMIN_USERNAME:admin}
app.security.admin-password=${ADMIN_PASSWORD:admin123}

# ?? CORS ???????????????????????????????????????????????????????????????????????
# Origin of the React dev server (npm start default = 3000)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# ?? Actuator ???????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
info.app.name=Lecture26 Backend
info.app.version=1.0.0

