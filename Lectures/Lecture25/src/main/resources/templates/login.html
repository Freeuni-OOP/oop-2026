<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Login')}"><title>Login</title></head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;background:#f0f4ff">
<div class="card" style="width:100%;max-width:420px">
    <div class="card-header bg-primary text-white text-center py-4">
        <i class="bi bi-mortarboard-fill fs-1 d-block mb-2"></i>
        <h4 class="mb-0 fw-bold">Student Manager</h4>
        <small class="opacity-75">Sign in to manage students</small>
    </div>
    <div class="card-body p-4">
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill"></i>
            You have been logged out.
        </div>
        <form th:action="@{/ui/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="admin"
                           autofocus/>
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"/>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
        </form>
        <hr class="my-3"/>
        <div class="text-center text-muted small">
            <i class="bi bi-info-circle me-1"></i>
            Default credentials: <code>admin</code> / <code>admin123</code>
        </div>
    </div>
    <div class="card-footer text-center py-3">
        <a th:href="@{/ui/students}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Back to student list
        </a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
