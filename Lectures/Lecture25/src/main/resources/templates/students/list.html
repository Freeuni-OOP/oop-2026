<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container pb-5">

    <!-- ── Flash message ── -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ── Stat cards ── -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card bg-primary">
                <div class="fs-1 fw-bold" th:text="${students.size()}">0</div>
                <div class="small opacity-75">Total Students</div>
            </div>
        </div>
        <th:block th:each="major : ${majors}">
        <div class="col-6 col-md-3" th:if="${major.name() == 'COMPUTER_SCIENCE'}">
            <div class="stat-card bg-success">
                <div class="fs-1 fw-bold" th:text="${csCount}">0</div>
                <div class="small opacity-75">CS Students</div>
            </div>
        </div>
        </th:block>
    </div>

    <!-- ── Toolbar ── -->
    <div class="card mb-4">
        <div class="card-body d-flex flex-wrap align-items-center justify-content-between gap-3">

            <!-- Filter by major -->
            <form th:action="@{/ui/students}" method="get" class="d-flex align-items-center gap-2">
                <label class="fw-semibold text-muted small">Filter:</label>
                <select name="major" class="form-select form-select-sm" onchange="this.form.submit()" style="width:200px">
                    <option value="">All Majors</option>
                    <option th:each="m : ${majors}"
                            th:value="${m.name()}"
                            th:text="${m.name().replace('_',' ')}"
                            th:selected="${m.name() == selectedMajor}">
                    </option>
                </select>
                <a th:href="@{/ui/students}" class="btn btn-sm btn-outline-secondary"
                   th:if="${selectedMajor != null && !selectedMajor.isEmpty()}">
                    <i class="bi bi-x-circle me-1"></i>Clear
                </a>
            </form>

            <!-- Add button (only when logged in) -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/ui/students/new}"
               class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Add Student
            </a>
            <a sec:authorize="!isAuthenticated()"
               th:href="@{/ui/login}"
               class="btn btn-outline-primary">
                <i class="bi bi-lock me-1"></i>Login to Add
            </a>
        </div>
    </div>

    <!-- ── Table ── -->
    <div class="card">
        <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
            <h5 class="mb-0"><i class="bi bi-table me-2 text-primary"></i>Student List</h5>
            <span class="badge bg-primary rounded-pill" th:text="${students.size()} + ' students'"></span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Major</th>
                            <th sec:authorize="isAuthenticated()" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${students.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                                No students found.
                            </td>
                        </tr>
                        <tr th:each="s : ${students}">
                            <td class="text-muted small" th:text="${s.id}"></td>
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                                         style="width:34px;height:34px;font-size:.85rem;flex-shrink:0"
                                         th:text="${s.name.substring(0,1)}">A</div>
                                    <span class="fw-semibold" th:text="${s.name}"></span>
                                </div>
                            </td>
                            <td class="text-muted" th:text="${s.email}"></td>
                            <td th:text="${s.age}"></td>
                            <td>
                                <span th:text="${s.major.name().replace('_',' ')}"
                                      th:classappend="${s.major.name() == 'COMPUTER_SCIENCE' ? 'bg-primary' :
                                                       (s.major.name() == 'MATHEMATICS'  ? 'bg-success' :
                                                       (s.major.name() == 'PHYSICS'       ? 'bg-warning text-dark' : 'bg-secondary'))}"
                                      class="badge badge-major">
                                </span>
                            </td>
                            <td sec:authorize="isAuthenticated()" class="text-end">
                                <a th:href="@{/ui/students/{id}/edit(id=${s.id})}"
                                   class="btn btn-sm btn-outline-secondary btn-action me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/ui/students/{id}/delete(id=${s.id})}"
                                      method="post" class="d-inline"
                                      onsubmit="return confirm('Delete ' + /*[[${s.name}]]*/ 'this student' + '?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger btn-action">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
